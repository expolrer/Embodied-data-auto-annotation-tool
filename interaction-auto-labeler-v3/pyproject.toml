[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robot-interaction-auto-labeler-v3"
version = "0.2.0"
description = "Scalable multimodal embodied-data annotation and quality pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.urls]
Repository = "https://github.com/expolrer/Embodied-data-auto-annotation-tool"

[project.optional-dependencies]
models = ["torch>=2.6"]
parquet = ["pyarrow>=17"]
ray = ["ray[default]>=2.40"]
test = ["pytest>=8"]

[project.scripts]
auto-labeler-v3 = "interaction_auto_labeler_v3.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interaction_auto_labeler_v3"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "interaction_auto_labeler_v3/schemas"
"configs" = "interaction_auto_labeler_v3/configs"

[tool.pytest.ini_options]
pythonpath = ["src", "../interaction-labeler-v1/src", "../interaction-auto-labeler-v2/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
